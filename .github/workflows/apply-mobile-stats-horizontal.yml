name: Apply mobile stats horizontal

on:
  push:
    branches:
      - fix/mobile-stats-horizontal
    paths:
      - .github/workflows/apply-mobile-stats-horizontal.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-stats-horizontal
          fetch-depth: 0

      - name: Update mobile stats layout
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = """      .stat-card {
        min-width: 0;
        min-height: 74px;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .stat-card:last-child {
        grid-column: 1 / -1;
      }

      .stat-card .num {
        font-size: 20px;
      }

      .stat-card .lbl {
        margin-top: 4px;
        font-size: 10px;
        line-height: 1.3;
        word-break: keep-all;
        overflow-wrap: normal;
      }
"""
          new = """      .stat-card {
        min-width: 0;
        min-height: 50px;
        padding: 8px 10px;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .stat-card:last-child {
        grid-column: 1 / -1;
      }

      .stat-card .num {
        order: 2;
        flex: 0 0 auto;
        font-size: 18px;
      }

      .stat-card .lbl {
        order: 1;
        margin-top: 0;
        font-size: 10px;
        line-height: 1.25;
        text-align: left;
        word-break: keep-all;
        overflow-wrap: normal;
      }
"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one mobile stats block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s+type="module")?>(.*?)</script>', text, re.S)
          if len(scripts) < 2:
              raise SystemExit(f'expected at least 2 scripts, found {len(scripts)}')
          Path('/tmp/accessories-main.mjs').write_text(scripts[0], encoding='utf-8')
          Path('/tmp/accessories-keyboard.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/accessories-main.mjs
          node --check /tmp/accessories-keyboard.js

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-mobile-stats-horizontal.yml
          git commit -m "Make mobile stats cards horizontal"
          git push origin HEAD:fix/mobile-stats-horizontal
