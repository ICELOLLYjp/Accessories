name: Apply production task feature v2

on:
  push:
    branches:
      - feat/production-tasks
    paths:
      - .github/workflows/apply-production-tasks-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/production-tasks
          fetch-depth: 0

      - name: Scope first CSS insertion and apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_production_tasks.py')
          s = p.read_text(encoding='utf-8')
          old = '    count = text.count(old)\n    if count != 1:\n        raise SystemExit(f"{label}: expected 1 match, found {count}")\n    text = text.replace(old, new, 1)'
          new = '    count = text.count(old)\n    if count < 1:\n        raise SystemExit(f"{label}: expected at least 1 match, found {count}")\n    text = text.replace(old, new, 1)'
          if old not in s:
              raise SystemExit('replace_once helper not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python scripts/apply_production_tasks.py

      - name: Validate expected feature markers
        run: |
          grep -q 'data-action="production-only"' index.html
          grep -q 'taskPiercing' index.html
          grep -q 'taskEarring' index.html
          grep -q '制作タスク' index.html
          grep -q '制作予定<br>合計' index.html

      - name: Commit generated change and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- scripts/apply_production_tasks.py
          git add index.html
          git rm scripts/apply_production_tasks.py .github/workflows/apply-production-tasks.yml .github/workflows/apply-production-tasks-v2.yml
          git commit -m "Add production tasks to accessory stock"
          git push origin HEAD:feat/production-tasks
