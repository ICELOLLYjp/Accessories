name: Apply production task layout

on:
  push:
    branches:
      - fix/production-task-layout
    paths:
      - .github/workflows/apply-production-task-layout.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/production-task-layout
          fetch-depth: 0

      - name: Update production task layout
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_css = '''    .stock-pair.task-pair {
              background: #FFF8E8;
              border: 1px solid #F0D397;
              border-radius: 10px;
              padding: 9px;
              margin-top: 9px;
            }

            .task-title {
              width: 100%;
              font-size: 11px;
              font-weight: 800;
              color: #9B6512;
            }
'''.replace('            ', '    ')

          new_css = '''    .stock-pair.task-pair {
              display: block;
              background: #F3F4F7;
              border: 1px solid var(--line);
              border-radius: 10px;
              padding: 9px 6px;
              margin-top: 9px;
            }

            .task-title {
              width: 100%;
              margin-bottom: 8px;
              font-size: 11px;
              font-weight: 800;
              color: var(--ink-soft);
            }

            .task-row {
              display: flex;
              align-items: center;
              justify-content: space-between;
              gap: 8px;
              width: 100%;
              flex-wrap: nowrap;
            }

            .task-row .stock-field {
              flex: 1 1 0;
              min-width: 0;
            }
'''.replace('            ', '    ')

          old_markup = '''          <div class="stock-pair task-pair">
            <div class="task-title">制作タスク</div>
            <div class="stock-field">
              <span class="fld-lbl">ピアス</span>
              ${stepperHtml(item, "taskPiercing", "#E8A33D")}
            </div>

            <div class="stock-field">
              <span class="fld-lbl">イヤリング</span>
              ${stepperHtml(item, "taskEarring", "#E8A33D")}
            </div>
          </div>'''

          new_markup = '''          <div class="stock-pair task-pair">
            <div class="task-title">制作タスク</div>
            <div class="task-row">
              <div class="stock-field">
                <span class="fld-lbl">ピアス</span>
                ${stepperHtml(item, "taskPiercing", "#E8A33D")}
              </div>

              <div class="stock-field">
                <span class="fld-lbl">イヤリング</span>
                ${stepperHtml(item, "taskEarring", "#E8A33D")}
              </div>
            </div>
          </div>'''

          if old_css not in text:
              raise SystemExit('Current production task CSS block was not found')
          if old_markup not in text:
              raise SystemExit('Current production task markup block was not found')

          text = text.replace(old_css, new_css, 1)
          text = text.replace(old_markup, new_markup, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate changes
        run: |
          grep -q 'background: #F3F4F7' index.html
          grep -q 'class="task-row"' index.html
          grep -q 'flex-wrap: nowrap' index.html
          ! grep -q 'background: #FFF8E8' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s+type="module")?>(.*?)</script>', text, re.S)
          Path('/tmp/accessories-main.mjs').write_text(scripts[0], encoding='utf-8')
          Path('/tmp/accessories-keyboard.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/accessories-main.mjs
          node --check /tmp/accessories-keyboard.js

      - name: Commit change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-production-task-layout.yml
          git commit -m "Align production task controls and use light gray background"
          git push origin HEAD:fix/production-task-layout
