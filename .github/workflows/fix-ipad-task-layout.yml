name: Fix iPad task layout

on:
  push:
    branches:
      - fix/ipad-task-layout
    paths:
      - .github/workflows/fix-ipad-task-layout.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ipad-task-layout
          fetch-depth: 0

      - name: Apply responsive task layout
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old_card = "    .card {\n      background: var(--surface);\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 12px;\n      position: relative;\n    }\n"
          new_card = "    .card {\n      background: var(--surface);\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 12px;\n      position: relative;\n      container-type: inline-size;\n    }\n"
          if text.count(old_card) != 1:
              raise SystemExit(f'card block match count: {text.count(old_card)}')
          text = text.replace(old_card, new_card, 1)
          marker = "    .empty-state {\n      text-align: center;\n      padding: 40px 16px;\n      color: var(--ink-soft);\n      font-size: 14px;\n    }\n\n"
          addition = "    .empty-state {\n      text-align: center;\n      padding: 40px 16px;\n      color: var(--ink-soft);\n      font-size: 14px;\n    }\n\n    @container (max-width: 330px) {\n      .task-row {\n        flex-wrap: wrap;\n        gap: 6px;\n      }\n\n      .task-row .stock-field {\n        flex: 1 1 100%;\n        justify-content: space-between;\n      }\n    }\n\n"
          if text.count(marker) != 1:
              raise SystemExit(f'empty-state marker count: {text.count(marker)}')
          text = text.replace(marker, addition, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s+type="module")?>(.*?)</script>', text, re.S)
          if len(scripts) < 2:
              raise SystemExit(f'expected at least 2 scripts, found {len(scripts)}')
          Path('/tmp/accessories-main.mjs').write_text(scripts[0], encoding='utf-8')
          Path('/tmp/accessories-keyboard.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/accessories-main.mjs
          node --check /tmp/accessories-keyboard.js

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-ipad-task-layout.yml
          git commit -m "Fix iPad task card layout"
          git push origin HEAD:fix/ipad-task-layout
