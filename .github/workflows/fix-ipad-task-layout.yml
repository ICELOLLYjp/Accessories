name: Fix iPad task layout

on:
  push:
    branches:
      - fix/ipad-task-layout
    paths:
      - .github/workflows/fix-ipad-task-layout.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ipad-task-layout
          fetch-depth: 0

      - name: Apply responsive task layout
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_card = '''    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      position: relative;
    }
'''
          new_card = '''    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      position: relative;
      container-type: inline-size;
    }
'''
          if text.count(old_card) != 1:
              raise SystemExit(f'card block match count: {text.count(old_card)}')
          text = text.replace(old_card, new_card, 1)

          marker = '''    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--ink-soft);
      font-size: 14px;
    }

'''
          addition = '''    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--ink-soft);
      font-size: 14px;
    }

    @container (max-width: 330px) {
      .task-row {
        flex-wrap: wrap;
        gap: 6px;
      }

      .task-row .stock-field {
        flex: 1 1 100%;
        justify-content: space-between;
      }
    }

'''
          if text.count(marker) != 1:
              raise SystemExit(f'empty-state marker count: {text.count(marker)}')
          text = text.replace(marker, addition, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s+type="module")?>(.*?)</script>', text, re.S)
          if len(scripts) < 2:
              raise SystemExit(f'expected at least 2 scripts, found {len(scripts)}')
          Path('/tmp/accessories-main.mjs').write_text(scripts[0], encoding='utf-8')
          Path('/tmp/accessories-keyboard.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/accessories-main.mjs
          node --check /tmp/accessories-keyboard.js

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-ipad-task-layout.yml
          git commit -m "Fix iPad task card layout"
          git push origin HEAD:fix/ipad-task-layout
