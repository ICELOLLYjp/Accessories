name: Apply production task feature

on:
  push:
    branches:
      - feat/production-tasks
    paths:
      - scripts/apply_production_tasks.py
      - .github/workflows/apply-production-tasks.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/production-tasks
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/apply_production_tasks.py

      - name: Validate expected feature markers
        run: |
          grep -q 'data-action="production-only"' index.html
          grep -q 'taskPiercing' index.html
          grep -q 'taskEarring' index.html
          grep -q '制作タスク' index.html

      - name: Commit generated change and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm scripts/apply_production_tasks.py .github/workflows/apply-production-tasks.yml
          git commit -m "Add production tasks to accessory stock"
          git push origin HEAD:feat/production-tasks
