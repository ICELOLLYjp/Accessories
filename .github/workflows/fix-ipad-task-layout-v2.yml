name: Fix iPad task layout v2

on:
  push:
    branches:
      - fix/ipad-task-layout
    paths:
      - .github/workflows/fix-ipad-task-layout-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ipad-task-layout
          fetch-depth: 0
      - name: Patch layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "    .card {\n      background: var(--surface);\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 12px;\n      position: relative;\n    }\n"
          new = "    .card {\n      background: var(--surface);\n      border: 1px solid var(--line);\n      border-radius: 14px;\n      padding: 12px;\n      position: relative;\n      container-type: inline-size;\n    }\n"
          if s.count(old) != 1:
              raise SystemExit(f'card block count {s.count(old)}')
          s = s.replace(old, new, 1)
          marker = "    .empty-state {\n      text-align: center;\n      padding: 40px 16px;\n      color: var(--ink-soft);\n      font-size: 14px;\n    }\n\n"
          add = marker + "    @container (max-width: 330px) {\n      .task-row {\n        flex-wrap: wrap;\n        gap: 6px;\n      }\n\n      .task-row .stock-field {\n        flex: 1 1 100%;\n        justify-content: space-between;\n      }\n    }\n\n"
          if s.count(marker) != 1:
              raise SystemExit(f'empty marker count {s.count(marker)}')
          s = s.replace(marker, add, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s+type="module")?>(.*?)</script>', s, re.S)
          Path('/tmp/a.mjs').write_text(scripts[0], encoding='utf-8')
          Path('/tmp/b.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/a.mjs
          node --check /tmp/b.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-ipad-task-layout.yml .github/workflows/fix-ipad-task-layout-v2.yml
          git commit -m "Fix iPad task layout"
          git push origin HEAD:fix/ipad-task-layout
