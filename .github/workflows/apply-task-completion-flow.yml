name: Apply task completion flow

on:
  push:
    branches:
      - feature/task-completion-flow
    paths:
      - .github/workflows/apply-task-completion-flow.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/task-completion-flow
          fetch-depth: 0

      - name: Apply task completion patch
        run: python scripts/apply_task_completion.py

      - name: Validate JavaScript
        run: |
          python -c "from pathlib import Path; import re; t=Path('index.html').read_text(encoding='utf-8'); s=re.findall(r'<script(?:\\s+type=\"module\")?>(.*?)</script>', t, re.S); assert len(s)>=2; Path('/tmp/accessories-main.mjs').write_text(s[0], encoding='utf-8'); Path('/tmp/accessories-keyboard.js').write_text(s[-1], encoding='utf-8')"
          node --check /tmp/accessories-main.mjs
          node --check /tmp/accessories-keyboard.js

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-task-completion-flow.yml
          git rm scripts/apply_task_completion.py
          git commit -m "Add task completion workflow"
          git push origin HEAD:feature/task-completion-flow
