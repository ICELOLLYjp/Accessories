name: Apply mobile stats font size

on:
  push:
    branches:
      - fix/mobile-stats-font-size
    paths:
      - .github/workflows/apply-mobile-stats-font-size.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-stats-font-size
          fetch-depth: 0

      - name: Reduce mobile stats font size
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = "      .stat-card {\n        min-width: 0;\n        min-height: 84px;\n        padding: 12px 14px;\n        display: flex;\n        flex-direction: column;\n        justify-content: center;\n      }\n\n      .stat-card:last-child {\n        grid-column: 1 / -1;\n      }\n\n      .stat-card .num {\n        font-size: 24px;\n      }\n\n      .stat-card .lbl {\n        margin-top: 5px;\n        font-size: 12px;\n        line-height: 1.35;\n        word-break: keep-all;\n        overflow-wrap: normal;\n      }\n"
          new = "      .stat-card {\n        min-width: 0;\n        min-height: 74px;\n        padding: 10px 12px;\n        display: flex;\n        flex-direction: column;\n        justify-content: center;\n      }\n\n      .stat-card:last-child {\n        grid-column: 1 / -1;\n      }\n\n      .stat-card .num {\n        font-size: 20px;\n      }\n\n      .stat-card .lbl {\n        margin-top: 4px;\n        font-size: 10px;\n        line-height: 1.3;\n        word-break: keep-all;\n        overflow-wrap: normal;\n      }\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected one mobile stats block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s+type="module")?>(.*?)</script>', text, re.S)
          if len(scripts) < 2:
              raise SystemExit(f'expected at least 2 scripts, found {len(scripts)}')
          Path('/tmp/accessories-main.mjs').write_text(scripts[0], encoding='utf-8')
          Path('/tmp/accessories-keyboard.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/accessories-main.mjs
          node --check /tmp/accessories-keyboard.js

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-mobile-stats-font-size.yml
          git commit -m "Reduce mobile stats font size"
          git push origin HEAD:fix/mobile-stats-font-size
