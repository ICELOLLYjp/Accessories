<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#EFF1F6"><title>アクセサリー イベント棚卸</title>
<style>
:root{--bg:#EFF1F6;--card:#fff;--line:#DFE2EC;--text:#262A3D;--sub:#6B7086;--accent:#2EC4B6;--accent-soft:#E4F9F6;--danger:#C93030;--ok:#18856f;--warm:#FFF7D8;--warm-line:#E8D38A;--unknown:#F5F1E8}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:820px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 9px max(42px,calc(env(safe-area-inset-bottom) + 26px))}h1{margin:0;font-size:22px}.sub,.note,.status{font-size:12px;line-height:1.5;color:var(--sub)}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px;margin-top:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}.btn,select,input{font:inherit}.btn{min-height:46px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--text);font-weight:800}.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}.btn:disabled{opacity:.45}.select,.search{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 11px;font-size:16px}.hidden{display:none!important}.status{margin-top:7px}.status.ok{color:var(--ok);font-weight:800}.status.err{color:var(--danger);font-weight:800}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.stat{border:1px solid var(--line);border-radius:11px;padding:8px;background:#fff}.stat strong{display:block;font-size:20px}.stat span{font-size:10px;color:var(--sub)}.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:9px}.checkpoint-tools{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.checkpoint{background:#f5fbfa}.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px}.chip{flex:0 0 auto;min-height:38px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 12px;font-size:11px;font-weight:800;color:var(--sub)}.chip.active{background:var(--text);border-color:var(--text);color:#fff}.list{display:grid;gap:8px;margin-top:10px}.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;align-items:center}.item.unknown{background:var(--unknown)}.item.stocked{border-color:var(--warm-line)}.name{font-size:14px;font-weight:900;line-height:1.3;overflow-wrap:anywhere}.detail,.opening{font-size:10px;color:var(--sub);line-height:1.4;margin-top:4px}.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}.badge{padding:3px 6px;border-radius:999px;font-size:9px;font-weight:900;background:#eee;color:#666}.badge.stocked{background:var(--warm);color:#7B5D00}.badge.registered{background:var(--accent-soft);color:#14766D}.badge.known{background:#dff5f1;color:#126d64}.badge.unknown{background:#e6dfd1;color:#725f3d}.qty{width:100%;height:44px;border:1px solid var(--line);border-radius:9px;text-align:center;font-size:18px;font-weight:900;background:#fff}.qty::placeholder{color:#856f45;font-size:13px}.step,.state-tools{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}.step button{height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:22px;font-weight:900;color:#218F85}.state-btn{min-height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:10px;font-weight:900}.state-btn.active{background:#74664e;color:#fff;border-color:#74664e}.state-btn.zero.active{background:var(--accent);border-color:var(--accent)}.warning{margin-top:8px;padding:9px;border:1px solid var(--warm-line);border-radius:10px;background:var(--warm);font-size:11px;line-height:1.5}.sort-note{font-size:11px;color:var(--sub);margin-top:7px}
@media(max-width:560px){.summary{grid-template-columns:repeat(2,1fr)}.item{grid-template-columns:minmax(0,1fr) 132px;gap:8px;padding:9px}.tools{grid-template-columns:1fr 1fr 1fr}.name{font-size:13px}}
</style></head><body><main class="app">
<div class="row"><div class="grow"><h1>アクセサリー イベント棚卸</h1><div class="sub">0 と「不明」を別々に記録します。不明を0へ自動変換しません。</div></div><a class="btn" style="display:flex;align-items:center;text-decoration:none" href="./">通常在庫</a></div>
<section class="card"><div id="authText" class="note">Googleログインを確認しています…</div><button id="loginButton" class="btn hidden" type="button" style="width:100%;margin-top:9px">Googleでログイン</button></section>
<section id="mainPanel" class="hidden"><div class="card"><label class="note" for="sessionSelect">イベント</label><select id="sessionSelect" class="select"><option value="">イベントを選択</option></select><div id="eventMeta" class="status"></div></div>
<div id="countPanel" class="hidden"><div class="card summary"><div class="stat"><strong id="knownStat">0</strong><span>確認済SKU</span></div><div class="stat"><strong id="unknownStat">0</strong><span>不明SKU</span></div><div class="stat"><strong id="qtyStat">0</strong><span>確認済点数</span></div><div class="stat"><strong id="openingStat">0</strong><span>開始点数</span></div></div>
<div class="card checkpoint"><strong>途中カウント / 日次締め</strong><div class="note">確認したSKUだけ保存できます。何も数えていない日でも日次記録を残せます。不明は不明のままです。</div><div class="checkpoint-tools"><button id="saveCheckpointButton" class="btn" type="button">途中カウント保存</button><button id="saveDailyButton" class="btn" type="button">日次締め保存</button></div></div>
<div class="card"><div class="row"><div class="grow"><strong>アクセサリー実数</strong><div class="note">数字を入れると「確認済」。数量0は「0」ボタン。不明は「不明」ボタン。キーボードではTab、Enter、矢印で数量欄を移動できます。</div></div><button id="reloadButton" class="btn" type="button">再読込</button></div>
<div class="tools"><button id="copyOpeningButton" class="btn" type="button">開始数をコピー</button><button id="zeroAllButton" class="btn" type="button">全部0</button><button id="unknownAllButton" class="btn" type="button">全部不明</button></div><div class="warning">「0」は実際に0点と確認した状態です。「不明」は未確認です。終了時も不明のまま残せます。</div>
<input id="searchInput" class="search" type="search" placeholder="商品名・SKUで検索" style="margin-top:10px"><div id="chips" class="chips"></div><div id="sortNote" class="sort-note"></div><div id="list" class="list"></div><div id="draftInfo" class="status"></div>
<div class="checkpoint-tools"><button id="saveDraftButton" class="btn" type="button">途中保存</button><button id="confirmButton" class="btn accent" type="button">棚卸を確定</button></div><div id="message" class="status"></div></div></div></section>
</main><script type="module" src="./event-count-v2.js?v=20260916-unknown-zero-1"></script><script>
(function () {
  const selectors = ".qty";
  const rows = "tr, .color-row, .mrow, .item";
  function visible(node) {
    return !node.disabled && node.getClientRects().length > 0;
  }
  document.addEventListener("focusin", event => {
    const input = event.target;
    if (input.matches?.(selectors) && typeof input.select === "function") input.select();
  });
  document.addEventListener("keydown", event => {
    const input = event.target;
    if (!input.matches?.(selectors) || event.isComposing || event.ctrlKey || event.altKey || event.metaKey) return;
    const key = event.key;
    if (!["Tab", "Enter", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(key)) return;
    const selector = selectors.split(",").find(part => input.matches(part.trim()))?.trim();
    const scope = input.closest(".if-card, .inventory-review, #matrix, #list, #view, #app") || document;
    const all = [...scope.querySelectorAll(selector)].filter(visible);
    const index = all.indexOf(input);
    if (index < 0) return;
    const direction = key === "ArrowLeft" || key === "ArrowUp" || (key === "Tab" && event.shiftKey) ? -1 : 1;
    let next = null;
    if (key.startsWith("Arrow")) {
      const row = input.closest(rows);
      const peers = row ? [...row.querySelectorAll(selector)].filter(visible) : [];
      const column = peers.indexOf(input);
      if (column >= 0 && (key === "ArrowLeft" || key === "ArrowRight")) {
        next = peers[column + direction] || null;
      } else if (column >= 0) {
        let neighbor = direction < 0 ? row.previousElementSibling : row.nextElementSibling;
        while (neighbor && !next) {
          const candidates = [...neighbor.querySelectorAll(selector)].filter(visible);
          next = candidates[column] || null;
          neighbor = direction < 0 ? neighbor.previousElementSibling : neighbor.nextElementSibling;
        }
      }
    }
    next ||= all[index + direction] || null;
    if (!next) return;
    event.preventDefault();
    event.stopPropagation();
    next.focus();
    next.select();
    next.scrollIntoView?.({ block: "nearest", inline: "nearest" });
  }, true);
})();
</script>
</body></html>
