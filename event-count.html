<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#EFF1F6">
<title>アクセサリー イベント棚卸</title>
<style>
:root{--bg:#EFF1F6;--card:#fff;--line:#DFE2EC;--text:#262A3D;--sub:#6B7086;--muted:#969bad;--accent:#2EC4B6;--accent2:#F45B8D;--danger:#C93030;--ok:#18856f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:780px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 12px max(42px,calc(env(safe-area-inset-bottom) + 26px))}h1{margin:0;font-size:22px}.sub{font-size:13px;line-height:1.55;color:var(--sub);margin-top:5px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px;margin-top:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}.btn,select,input{font:inherit}.btn{min-height:44px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--text);font-weight:800}.btn.primary{background:var(--text);border-color:var(--text);color:#fff}.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}.select,.search{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 11px;font-size:16px}.status{font-size:12px;line-height:1.5;color:var(--sub);margin-top:7px}.status.ok{color:var(--ok);font-weight:800}.status.err{color:var(--danger);font-weight:800}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.stat strong{display:block;font-size:22px}.stat span{font-size:11px;color:var(--sub)}.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px}.chip{flex:0 0 auto;min-height:36px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:0 12px;font-size:12px;font-weight:800;color:var(--sub)}.chip.active{background:var(--text);border-color:var(--text);color:#fff}.list{display:grid;gap:8px;margin-top:10px}.item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}.name{font-size:14px;font-weight:800;line-height:1.3;overflow-wrap:anywhere}.detail{font-size:11px;line-height:1.4;color:var(--sub);margin-top:3px}.opening{font-size:11px;color:var(--muted);margin-top:4px}.step{display:grid;grid-template-columns:36px 54px 36px;gap:4px;align-items:center}.step button{height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:20px;font-weight:900}.qty{width:54px;height:38px;border:1px solid var(--line);border-radius:9px;text-align:center;font-size:16px;font-weight:800}.unentered{border-color:#f0b8c9;background:#fffafd}.note{font-size:12px;color:var(--sub);line-height:1.55}.hidden{display:none!important}@media(max-width:520px){.item{grid-template-columns:1fr}.step{justify-self:end}.summary{gap:6px}.stat{padding:8px}.stat strong{font-size:19px}}
</style>
</head>
<body><main class="app">
<div class="row"><div class="grow"><h1>イベント棚卸</h1><div class="sub">アクセサリーのイベント終了実数を数えます。途中保存はSales Managerの終了在庫に反映しません。</div></div><a class="btn" style="display:flex;align-items:center;text-decoration:none" href="./">通常在庫</a></div>
<section id="authCard" class="card"><div id="authText" class="note">Googleログインを確認しています…</div><button id="loginButton" class="btn primary hidden" type="button" style="width:100%;margin-top:10px">Googleでログイン</button></section>
<section id="mainPanel" class="hidden">
<div class="card"><label class="note" for="sessionSelect">イベント</label><select id="sessionSelect" class="select"><option value="">イベントを選択</option></select><div id="eventMeta" class="status"></div></div>
<div id="countPanel" class="hidden">
<div class="card summary"><div class="stat"><strong id="countedStat">0/0</strong><span>入力SKU</span></div><div class="stat"><strong id="qtyStat">0</strong><span>終了点数</span></div><div class="stat"><strong id="openingStat">0</strong><span>開始点数</span></div></div>
<div class="card"><div class="row"><div class="grow"><strong>終了実数を入力</strong><div class="note">0個も必ず「0」で入力してください。検索やカテゴリ絞り込みができます。</div></div><button id="reloadButton" class="btn" type="button">再読込</button></div>
<div class="tools"><button id="copyOpeningButton" class="btn" type="button">開始数をコピー</button><button id="zeroAllButton" class="btn" type="button">すべて0</button></div>
<input id="searchInput" class="search" type="search" placeholder="商品名・SKUで検索" style="margin-top:10px">
<div id="chips" class="chips"></div><label class="note" style="display:flex;gap:7px;align-items:center;margin-top:9px"><input id="onlyMissing" type="checkbox">未入力だけ表示</label>
<div id="list" class="list"></div><div id="draftInfo" class="status"></div>
<div class="tools"><button id="saveDraftButton" class="btn" type="button">途中保存</button><button id="confirmButton" class="btn accent" type="button">棚卸を確定</button></div><div id="message" class="status"></div></div>
</div></section>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, updateDoc, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyA1AZlnCYr5cfHG3HDcyvG17jokBnr5lO8",authDomain:"t-shirtstock.firebaseapp.com",projectId:"t-shirtstock",storageBucket:"t-shirtstock.firebasestorage.app",messagingSenderId:"485805702075",appId:"1:485805702075:web:f9d8668ca57d9f58c4229e",measurementId:"G-TXEHB9FGSR"};
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);const provider=new GoogleAuthProvider();const CATS=["pierce","earring","drop_pierce","drop_earring"];const CAT_LABEL={pierce:"ピアス",earring:"イヤリング",drop_pierce:"ドロップピアス",drop_earring:"ドロップイヤリング"};const $=id=>document.getElementById(id);let user=null,sessions=[],session=null,rows=[],values=new Map(),category="all";
function n(v){const x=Number(v);return Number.isFinite(x)?Math.max(0,Math.floor(x)):0}function text(v){return String(v??"").trim()}function esc(v){return text(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}function timestampText(v){try{if(v?.toDate)return v.toDate().toLocaleString("ja-JP")}catch{}return ""}function setMessage(msg,type=""){const el=$("message");el.textContent=msg;el.className=`status ${type}`.trim()}
async function loadSessions(){const snap=await getDocs(collection(db,"salesSessions"));sessions=snap.docs.map(d=>({sessionId:d.id,...d.data()})).filter(s=>(s.status==="open"||s.status==="pending_allocation")&&Array.isArray(s?.inventoryCount?.opening?.items));sessions.sort((a,b)=>text(b.startDate).localeCompare(text(a.startDate)));$("sessionSelect").innerHTML='<option value="">イベントを選択</option>'+sessions.map(s=>`<option value="${esc(s.sessionId)}">${esc(s.eventName||s.sessionId)}${s.status==="pending_allocation"?"（仮終了中）":""}</option>`).join("");const requested=new URLSearchParams(location.search).get("session");if(requested&&sessions.some(s=>s.sessionId===requested)){$("sessionSelect").value=requested;await chooseSession(requested)}}
function buildRows(data){const opening=(data?.inventoryCount?.opening?.items||[]).filter(item=>CATS.includes(item.category)&&item.inventorySource==="accessory");const closingMap=new Map((data?.inventoryCount?.closing?.items||[]).map(x=>[x.variantId,x]));const draftMap=new Map((data?.inventoryCount?.externalCounts?.accessory?.draftItems||[]).map(x=>[x.variantId,x]));rows=opening.map(item=>({...item,closing:closingMap.get(item.variantId)||null,draft:draftMap.get(item.variantId)||null})).sort((a,b)=>CATS.indexOf(a.category)-CATS.indexOf(b.category)||text(a.label).localeCompare(text(b.label),"ja")||text(a.detail).localeCompare(text(b.detail),"ja"));values=new Map();rows.forEach(r=>{const source=r.draft||r.closing;if(source&&source.closingQty!==null&&source.closingQty!==undefined&&source.closingQty!=="")values.set(r.variantId,n(source.closingQty));else values.set(r.variantId,null)})}
function renderChips(){const counts=new Map();rows.forEach(r=>counts.set(r.category,(counts.get(r.category)||0)+1));$("chips").innerHTML=[["all","すべて"],...CATS.map(c=>[c,CAT_LABEL[c]])].map(([c,label])=>`<button type="button" class="chip ${c===category?"active":""}" data-cat="${c}">${label}${c==="all"?` ${rows.length}`:` ${counts.get(c)||0}`}</button>`).join("");document.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{category=b.dataset.cat;renderChips();renderList()}))}
function filteredRows(){const q=text($("searchInput").value).toLocaleLowerCase();const missingOnly=$("onlyMissing").checked;return rows.filter(r=>(category==="all"||r.category===category)&&(!q||`${r.label} ${r.detail} ${r.sku}`.toLocaleLowerCase().includes(q))&&(!missingOnly||values.get(r.variantId)===null))}
function renderList(){const visible=filteredRows();$("list").innerHTML=visible.length?visible.map(r=>{const value=values.get(r.variantId);return`<div class="item ${value===null?"unentered":""}" data-id="${esc(r.variantId)}"><div><div class="name">${esc(r.label||r.sku||r.variantId)}</div><div class="detail">${esc(CAT_LABEL[r.category]||r.category)}${r.detail?` / ${esc(r.detail)}`:""}${r.sku?`<br>${esc(r.sku)}`:""}</div><div class="opening">開始 ${n(r.openingQty)}</div></div><div class="step"><button type="button" data-step="-1" data-id="${esc(r.variantId)}">−</button><input class="qty" data-id="${esc(r.variantId)}" type="number" min="0" step="1" inputmode="numeric" value="${value===null?"":value}" placeholder="—"><button type="button" data-step="1" data-id="${esc(r.variantId)}">＋</button></div></div>`}).join(""):'<div class="note" style="text-align:center;padding:24px 0">該当する商品はありません</div>';bindInputs();updateSummary()}
function bindInputs(){document.querySelectorAll(".qty").forEach(i=>i.addEventListener("input",()=>{values.set(i.dataset.id,i.value===""?null:n(i.value));renderList()}));document.querySelectorAll("[data-step]").forEach(b=>b.addEventListener("click",()=>{const id=b.dataset.id;values.set(id,Math.max(0,n(values.get(id)||0)+Number(b.dataset.step)));renderList()}))}
function updateSummary(){const counted=[...values.values()].filter(v=>v!==null).length;$("countedStat").textContent=`${counted}/${rows.length}`;$("qtyStat").textContent=[...values.values()].reduce((s,v)=>s+(v===null?0:n(v)),0);$("openingStat").textContent=rows.reduce((s,r)=>s+n(r.openingQty),0)}function itemsFromValues(){return rows.map(r=>({variantId:r.variantId,closingQty:values.get(r.variantId)}))}
async function chooseSession(id){setMessage("");const snap=await getDoc(doc(db,"salesSessions",id));if(!snap.exists())throw new Error("イベントが見つかりません。");session={sessionId:id,...snap.data()};buildRows(session);$("eventMeta").textContent=[session.eventName,session.city,session.country,session.startDate&&session.endDate?`${session.startDate}〜${session.endDate}`:""].filter(Boolean).join(" / ");$("countPanel").classList.toggle("hidden",!rows.length);if(!rows.length){$("eventMeta").textContent+=" / アクセサリー開始在庫がありません";return}renderChips();renderList();const ext=session?.inventoryCount?.externalCounts?.accessory;$("draftInfo").textContent=ext?.status==="confirmed"?`前回確定: ${timestampText(ext.confirmedAt)||"保存済み"}`:ext?.status==="draft"?`途中保存あり: ${timestampText(ext.savedAt)||"保存済み"}`:""}
async function saveDraft(){if(!session)return;setMessage("保存中…");const items=itemsFromValues();await updateDoc(doc(db,"salesSessions",session.sessionId),{"inventoryCount.externalCounts.accessory":{status:"draft",source:"accessory_stock_app",savedAt:serverTimestamp(),savedByEmail:user?.email||"",draftItems:items},"inventoryCount.updatedAt":serverTimestamp(),updatedAt:serverTimestamp()});setMessage("途中保存しました。Sales Managerの終了在庫にはまだ反映していません。","ok");await chooseSession(session.sessionId)}
async function confirmCount(){if(!session)return;const items=itemsFromValues();const missing=items.filter(x=>x.closingQty===null);if(missing.length){setMessage(`未入力が ${missing.length} SKUあります。0個も「0」と入力してください。`,"err");return}if(!confirm(`アクセサリー ${items.length} SKU、終了合計 ${items.reduce((s,x)=>s+n(x.closingQty),0)} 点で棚卸を確定しますか？`))return;setMessage("確定中…");const ref=doc(db,"salesSessions",session.sessionId);await runTransaction(db,async tx=>{const snap=await tx.get(ref);if(!snap.exists())throw new Error("イベントが見つかりません。");const current=snap.data();if(current.status!=="open"&&current.status!=="pending_allocation")throw new Error("正式終了済みイベントは変更できません。");const ids=new Set((current?.inventoryCount?.opening?.items||[]).filter(x=>CATS.includes(x.category)&&x.inventorySource==="accessory").map(x=>x.variantId));const existing=current?.inventoryCount?.closing?.items||[];const existingMap=new Map(existing.map(x=>[x.variantId,x]));const preserved=existing.filter(x=>!ids.has(x.variantId));const merged=items.map(x=>({...existingMap.get(x.variantId),variantId:x.variantId,closingQty:n(x.closingQty),loss:n(existingMap.get(x.variantId)?.loss),theft:n(existingMap.get(x.variantId)?.theft),damage:n(existingMap.get(x.variantId)?.damage),gift:n(existingMap.get(x.variantId)?.gift),sample:n(existingMap.get(x.variantId)?.sample),stockAdjustment:Number(existingMap.get(x.variantId)?.stockAdjustment||0)}));const totalQty=merged.reduce((s,x)=>s+n(x.closingQty),0);tx.update(ref,{"inventoryCount.closing":{savedAt:serverTimestamp(),savedByEmail:user?.email||"",items:[...preserved,...merged]},"inventoryCount.externalCounts.accessory":{status:"confirmed",source:"accessory_stock_app",confirmedAt:serverTimestamp(),confirmedByEmail:user?.email||"",countedCount:merged.length,totalSkuCount:merged.length,totalQty},"inventoryCount.updatedAt":serverTimestamp(),updatedAt:serverTimestamp()})});setMessage("棚卸を確定しました。Sales Managerの終了在庫へ反映済みです。","ok");await chooseSession(session.sessionId)}
$("loginButton").addEventListener("click",()=>signInWithPopup(auth,provider));$("sessionSelect").addEventListener("change",e=>e.target.value?chooseSession(e.target.value):$("countPanel").classList.add("hidden"));$("reloadButton").addEventListener("click",()=>session&&chooseSession(session.sessionId));$("copyOpeningButton").addEventListener("click",()=>{rows.forEach(r=>values.set(r.variantId,n(r.openingQty)));renderList()});$("zeroAllButton").addEventListener("click",()=>{rows.forEach(r=>values.set(r.variantId,0));renderList()});$("searchInput").addEventListener("input",renderList);$("onlyMissing").addEventListener("change",renderList);$("saveDraftButton").addEventListener("click",()=>saveDraft().catch(e=>setMessage(e.message||String(e),"err")));$("confirmButton").addEventListener("click",()=>confirmCount().catch(e=>setMessage(e.message||String(e),"err")));
onAuthStateChanged(auth,async current=>{user=current;$("authText").textContent=current?`ログイン中: ${current.email||""}`:"イベント棚卸を使うにはログインしてください。";$("loginButton").classList.toggle("hidden",Boolean(current));$("mainPanel").classList.toggle("hidden",!current);if(current){try{await loadSessions()}catch(e){$("authText").textContent=`読込エラー: ${e.message||e}`}}});
</script>
</body></html>
